# Databricks Provisioning Workflow
# Generates Terraform configuration for Databricks schemas and tables
# Triggered from Backstage Portal via workflow_dispatch

name: Databricks Provisioning

on:
  workflow_dispatch:
    inputs:
      resource-type:
        description: 'Resource type to create (schema, table, both)'
        required: true
        type: string
      catalog-name:
        description: 'Unity Catalog name'
        required: true
        type: string
      schema-name:
        description: 'Schema (database) name'
        required: true
        type: string
      table-name:
        description: 'Table name (if creating table)'
        required: false
        type: string
      environment:
        description: 'Environment (dev, staging, prod)'
        required: true
        type: string
      layer:
        description: 'Medallion layer (bronze, silver, gold, platinum)'
        required: true
        type: string
      table-type:
        description: 'Table type (managed, external)'
        required: false
        default: 'managed'
        type: string
      table-format:
        description: 'Table format (delta, parquet, orc, csv, json)'
        required: false
        default: 'delta'
        type: string
      partition-columns:
        description: 'Comma-separated partition columns'
        required: false
        type: string
      cluster-columns:
        description: 'Comma-separated Z-Order/cluster columns'
        required: false
        type: string
      enable-auto-optimize:
        description: 'Enable auto optimize'
        required: false
        default: 'true'
        type: string
      enable-cdf:
        description: 'Enable Change Data Feed'
        required: false
        default: 'false'
        type: string
      enable-deletion-vectors:
        description: 'Enable Deletion Vectors'
        required: false
        default: 'true'
        type: string
      retention-hours:
        description: 'Delta log retention hours'
        required: false
        default: '168'
        type: string
      schema-comment:
        description: 'Schema description'
        required: false
        type: string
      table-comment:
        description: 'Table description'
        required: false
        type: string
      external-location:
        description: 'External storage location (S3 path)'
        required: false
        type: string
      owner-email:
        description: 'Owner email address'
        required: false
        default: 'data-engineering@company.com'
        type: string
      tags:
        description: 'JSON tags for governance'
        required: false
        default: '{}'
        type: string

env:
  DATABRICKS_HOST: `${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: `${{ secrets.DATABRICKS_TOKEN }}

jobs:
  generate-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Resource Name
        id: names
        run: |
          # Create safe resource names for Terraform
          SCHEMA_SAFE=`$(echo "`${{ inputs.schema-name }}" | tr '-' '_' | tr '.' '_')
          TABLE_SAFE=`$(echo "`${{ inputs.table-name }}" | tr '-' '_' | tr '.' '_')
          TIMESTAMP=`$(date +%Y%m%d%H%M%S)
          
          echo "schema_safe=`$SCHEMA_SAFE" >> `$GITHUB_OUTPUT
          echo "table_safe=`$TABLE_SAFE" >> `$GITHUB_OUTPUT
          echo "timestamp=`$TIMESTAMP" >> `$GITHUB_OUTPUT
          echo "branch_name=databricks-`${{ inputs.catalog-name }}-`$SCHEMA_SAFE-`$TIMESTAMP" >> `$GITHUB_OUTPUT

      - name: Create Directory Structure
        run: |
          mkdir -p environments/`${{ inputs.environment }}/`${{ inputs.catalog-name }}/`${{ inputs.schema-name }}

      - name: Generate Schema Terraform Configuration
        if: `${{ inputs.resource-type == 'schema' || inputs.resource-type == 'both' }}
        run: |
          SCHEMA_FILE="environments/`${{ inputs.environment }}/`${{ inputs.catalog-name }}/`${{ inputs.schema-name }}/schema.tf"
          
          cat > "`$SCHEMA_FILE" << 'EOF'
# Databricks Schema: `${{ inputs.schema-name }}
# Generated by Toyota Data Engineering Portal
# Environment: `${{ inputs.environment }}
# Layer: `${{ inputs.layer }}
# Owner: `${{ inputs.owner-email }}
# Generated: `${{ steps.names.outputs.timestamp }}

terraform {
  required_providers {
    databricks = {
      source  = "databricks/databricks"
      version = "~> 1.0"
    }
  }
}

provider "databricks" {
  # Authentication via environment variables:
  # DATABRICKS_HOST and DATABRICKS_TOKEN
}

resource "databricks_schema" "`${{ steps.names.outputs.schema_safe }}" {
  catalog_name = "`${{ inputs.catalog-name }}"
  name         = "`${{ inputs.schema-name }}"
  comment      = "`${{ inputs.schema-comment || format('Schema for {0} - {1} layer', inputs.schema-name, inputs.layer) }}"
  owner        = "`${{ inputs.owner-email }}"

  properties = {
    environment  = "`${{ inputs.environment }}"
    layer        = "`${{ inputs.layer }}"
    managed_by   = "Terraform"
    created_by   = "Toyota-Data-Engineering-Portal"
    created_date = "`${{ steps.names.outputs.timestamp }}"
  }
}

output "`${{ steps.names.outputs.schema_safe }}_full_name" {
  value       = databricks_schema.`${{ steps.names.outputs.schema_safe }}.id
  description = "The full name of the schema (catalog.schema)"
}

output "`${{ steps.names.outputs.schema_safe }}_name" {
  value       = databricks_schema.`${{ steps.names.outputs.schema_safe }}.name
  description = "The name of the schema"
}
EOF

          echo " Generated schema configuration: `$SCHEMA_FILE"

      - name: Generate Table Terraform Configuration
        if: `${{ inputs.resource-type == 'table' || inputs.resource-type == 'both' }}
        run: |
          TABLE_FILE="environments/`${{ inputs.environment }}/`${{ inputs.catalog-name }}/`${{ inputs.schema-name }}/table_`${{ steps.names.outputs.table_safe }}.tf"
          
          # Build partition columns array
          PARTITION_COLS=""
          if [ -n "`${{ inputs.partition-columns }}" ]; then
            IFS=',' read -ra COLS <<< "`${{ inputs.partition-columns }}"
            for col in "`${COLS[@]}"; do
              col=`$(echo "`$col" | xargs)  # trim whitespace
              PARTITION_COLS="`${PARTITION_COLS}    \"`$col\",\n"
            done
          fi

          # Build cluster columns array
          CLUSTER_COLS=""
          if [ -n "`${{ inputs.cluster-columns }}" ]; then
            IFS=',' read -ra COLS <<< "`${{ inputs.cluster-columns }}"
            for col in "`${COLS[@]}"; do
              col=`$(echo "`$col" | xargs)
              CLUSTER_COLS="`${CLUSTER_COLS}    \"`$col\",\n"
            done
          fi

          cat > "`$TABLE_FILE" << EOF
# Databricks Table: `${{ inputs.table-name }}
# Generated by Toyota Data Engineering Portal
# Schema: `${{ inputs.catalog-name }}.`${{ inputs.schema-name }}
# Environment: `${{ inputs.environment }}
# Layer: `${{ inputs.layer }}
# Format: `${{ inputs.table-format }}
# Generated: `${{ steps.names.outputs.timestamp }}

resource "databricks_sql_table" "`${{ steps.names.outputs.table_safe }}" {
  catalog_name     = "`${{ inputs.catalog-name }}"
  schema_name      = "`${{ inputs.schema-name }}"
  name             = "`${{ inputs.table-name }}"
  table_type       = "`${{ inputs.table-type == 'managed' && 'MANAGED' || 'EXTERNAL' }}"
  data_source_format = "`${{ inputs.table-format == 'delta' && 'DELTA' || inputs.table-format | upper }}"
  comment          = "`${{ inputs.table-comment || format('{0} layer table for {1}', inputs.layer, inputs.table-name) }}"
  owner            = "`${{ inputs.owner-email }}"

  # Table columns - define your schema here
  column {
    name    = "id"
    type    = "BIGINT"
    comment = "Primary identifier"
  }

  column {
    name    = "created_at"
    type    = "TIMESTAMP"
    comment = "Record creation timestamp"
  }

  column {
    name    = "updated_at"
    type    = "TIMESTAMP"
    comment = "Record last update timestamp"
  }

  column {
    name    = "_metadata_layer"
    type    = "STRING"
    comment = "Medallion architecture layer"
  }

  properties = {
    "environment"                      = "`${{ inputs.environment }}"
    "layer"                            = "`${{ inputs.layer }}"
    "delta.autoOptimize.optimizeWrite" = "`${{ inputs.enable-auto-optimize }}"
    "delta.autoOptimize.autoCompact"   = "`${{ inputs.enable-auto-optimize }}"
    "delta.enableChangeDataFeed"       = "`${{ inputs.enable-cdf }}"
    "delta.enableDeletionVectors"      = "`${{ inputs.enable-deletion-vectors }}"
    "delta.logRetentionDuration"       = "interval `${{ inputs.retention-hours }} hours"
    "managed_by"                       = "Terraform"
    "created_by"                       = "Toyota-Data-Engineering-Portal"
  }

  depends_on = [databricks_schema.`${{ steps.names.outputs.schema_safe }}]
}

output "`${{ steps.names.outputs.table_safe }}_full_name" {
  value       = databricks_sql_table.`${{ steps.names.outputs.table_safe }}.id
  description = "The full name of the table (catalog.schema.table)"
}
EOF

          echo " Generated table configuration: `$TABLE_FILE"

      - name: Generate Terragrunt Configuration
        run: |
          TG_FILE="environments/`${{ inputs.environment }}/`${{ inputs.catalog-name }}/`${{ inputs.schema-name }}/terragrunt.hcl"
          
          cat > "`$TG_FILE" << 'EOF'
# Terragrunt configuration for Databricks resources
# Generated by Toyota Data Engineering Portal

include "root" {
  path = find_in_parent_folders()
}

terraform {
  source = "."
}

inputs = {
  environment  = "`${{ inputs.environment }}"
  catalog_name = "`${{ inputs.catalog-name }}"
  schema_name  = "`${{ inputs.schema-name }}"
  layer        = "`${{ inputs.layer }}"
}
EOF

          echo " Generated terragrunt configuration: `$TG_FILE"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: `${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add Databricks `${{ inputs.resource-type }}: `${{ inputs.catalog-name }}.`${{ inputs.schema-name }}`${{ inputs.table-name && format('.{0}', inputs.table-name) || '' }}"
          branch: `${{ steps.names.outputs.branch_name }}
          title: "Add Databricks `${{ inputs.resource-type }}: `${{ inputs.catalog-name }}.`${{ inputs.schema-name }}`${{ inputs.table-name && format('.{0}', inputs.table-name) || '' }}"
          body: |
            ## Databricks Resource Provisioning
            
            **Generated by:** Toyota Data Engineering Portal (Backstage)
            **Requested at:** `${{ steps.names.outputs.timestamp }}
            
            ### Resource Details
            | Property | Value |
            |----------|-------|
            | Resource Type | `${{ inputs.resource-type }} |
            | Catalog | `${{ inputs.catalog-name }} |
            | Schema | `${{ inputs.schema-name }} |
            | Table | `${{ inputs.table-name || 'N/A' }} |
            | Environment | `${{ inputs.environment }} |
            | Layer | `${{ inputs.layer }} |
            | Format | `${{ inputs.table-format }} |
            | Owner | `${{ inputs.owner-email }} |
            
            ### Delta Features
            - Auto Optimize: `${{ inputs.enable-auto-optimize }}
            - Change Data Feed: `${{ inputs.enable-cdf }}
            - Deletion Vectors: `${{ inputs.enable-deletion-vectors }}
            - Log Retention: `${{ inputs.retention-hours }} hours
            
            ### Files Generated
            - `environments/`${{ inputs.environment }}/`${{ inputs.catalog-name }}/`${{ inputs.schema-name }}/`
            
            ---
            
            ** Review the generated Terraform configuration before merging.**
            
            Once merged, the `databricks-apply.yml` workflow will automatically apply the changes.
          labels: |
            databricks
            auto-generated
            `${{ inputs.environment }}
            `${{ inputs.layer }}

      - name: Output PR URL
        run: |
          echo "##  Pull Request Created!" >> `$GITHUB_STEP_SUMMARY
          echo "" >> `$GITHUB_STEP_SUMMARY
          echo "**PR Number:** #`${{ steps.create-pr.outputs.pull-request-number }}" >> `$GITHUB_STEP_SUMMARY
          echo "**PR URL:** `${{ steps.create-pr.outputs.pull-request-url }}" >> `$GITHUB_STEP_SUMMARY
          echo "" >> `$GITHUB_STEP_SUMMARY
          echo "### Resource Details" >> `$GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> `$GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> `$GITHUB_STEP_SUMMARY
          echo "| Resource Type | `${{ inputs.resource-type }} |" >> `$GITHUB_STEP_SUMMARY
          echo "| Catalog | `${{ inputs.catalog-name }} |" >> `$GITHUB_STEP_SUMMARY
          echo "| Schema | `${{ inputs.schema-name }} |" >> `$GITHUB_STEP_SUMMARY
          echo "| Table | `${{ inputs.table-name || 'N/A' }} |" >> `$GITHUB_STEP_SUMMARY
          echo "| Environment | `${{ inputs.environment }} |" >> `$GITHUB_STEP_SUMMARY
          echo "| Layer | `${{ inputs.layer }} |" >> `$GITHUB_STEP_SUMMARY
          echo "" >> `$GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> `$GITHUB_STEP_SUMMARY
          echo "1. Review the generated Terraform configuration" >> `$GITHUB_STEP_SUMMARY
          echo "2. Approve and merge the PR" >> `$GITHUB_STEP_SUMMARY
          echo "3. The \`databricks-apply.yml\` workflow will automatically apply the changes" >> `$GITHUB_STEP_SUMMARY
